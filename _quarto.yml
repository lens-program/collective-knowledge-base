project:
  type: website
  output-dir: _site
  render:
    - terminology-and-references.qmd

website:
  title: "LENS Collective Knowledge Base"
  site-url: "https://lens-program.github.io/collective-knowledge-base/"
  repo-url: "https://github.com/lens-program/collective-knowledge-base"
  repo-actions: [edit]
  search: true
  navbar:
    right:
      - text: "LENS Program"
        href: "https://lens-program.github.io/lens-program/"
      - icon: github
        href: "https://github.com/lens-program/collective-knowledge-base"

bibliography: references.bib
link-citations: true

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-expand: 1
    html-math-method: katex
