name: Open question
description: Raise a question about identifiability or recoverability that we cannot yet answer
title: "[question] "
labels: [open-question]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where it came up
      description: Seminar, paper, application, concept page...
  - type: input
    id: concepts
    attributes:
      label: Related concepts
