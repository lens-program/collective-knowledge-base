<script>
// Show third-level section numbers as letters: 2.1.3 -> 2.1.C (headings and table of contents)
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".header-section-number").forEach(function (el) {
    var parts = el.textContent.trim().split(".");
    if (parts.length === 3 && /^\d+$/.test(parts[2])) {
      parts[2] = String.fromCharCode(64 + parseInt(parts[2], 10));
      el.textContent = parts.join(".");
    }
  });
});
</script>
